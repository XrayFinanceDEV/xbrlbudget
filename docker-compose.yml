services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.docker
    environment:
      - DATABASE_PATH=/app/data/financial_analysis.db
      - DEBUG=false
      # MinerU OCR: le scansioni caricate su /import/pdf passano da MinerU, che
      # gira su gx10 (GPU), mai sul VPS. MINERU_OCR_ENABLED / MINERU_BASE_URL /
      # MINERU_EXPECTED_VERSION NON stanno qui di proposito: una riga `environment:`
      # scavalcherebbe l'env_file, cioe' la credenziale Jenkins `budget-env-staging`
      # che li imposta per server. Default in backend/app/core/config.py (gx10 sulla
      # tailnet). Se MinerU non risponde la scansione prosegue sull'OCR di ripiego
      # e lo dichiara.
      # Il servizio `mineru` qui sotto resta solo per la macchina di sviluppo:
      #   MINERU_BASE_URL=http://mineru:8000 docker compose --profile mineru up -d
    volumes:
      - db-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # MinerU OCR document extractor (pinned to the deployed 3.2.0 image). Not
  # published to the host and not proxied by nginx — only the backend reaches it
  # as http://mineru:8000 on the compose network. Healthcheck uses python (the
  # image has no curl).
  #
  # ⚠️  DEVELOPER MACHINE ONLY — never deploy this on the VPS.
  # It is `FROM vllm/vllm-openai`, a multi-GB GPU image. The `profiles:` key below
  # excludes it from EVERY compose command (including `build`) unless the profile
  # is explicitly requested, so Jenkins' `docker compose build --no-cache --parallel`
  # + `up -d` on the VPS never touches it. Without the profile the VPS build pulled
  # ~2 GB of vLLM layers before anyone noticed.
  # To run it locally:  docker compose --profile mineru up -d
  mineru:
    profiles: ["mineru"]
    build:
      context: .
      dockerfile: docker/mineru/Dockerfile
      args:
        MINERU_VERSION: "3.2.0"
    image: ${MINERU_IMAGE:-xbrlbudget-mineru:3.2.0}
    command: ["mineru-api", "--host", "0.0.0.0", "--port", "8000"]
    shm_size: "8gb"
    expose:
      - "8000"
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_API_MAX_CONCURRENT_REQUESTS: "1"
      MINERU_API_TASK_RETENTION_SECONDS: "3600"
    volumes:
      - mineru-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if b'healthy' in urllib.request.urlopen('http://localhost:8000/health',timeout=5).read() else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_PARENT_ORIGIN: ${PARENT_ORIGIN:-}
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  db-data:
  mineru-models:
